<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¡Pégate con tu Carro Nuevo!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #222;
      color: white;
      padding: 1em 0;
    }
    .car-image {
      width: 100%;
      max-width: 600px;
      margin: 1em auto;
    }
    .instructions {
      padding: 1em;
      background-color: #fff;
      margin: 1em auto;
      max-width: 700px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .button {
      background-color: #007bff;
      color: white;
      padding: 1em 2em;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
      margin: 1em 0;
    }
    .form-container {
      display: none;
      max-width: 700px;
      margin: 2em auto;
      background-color: #fff;
      padding: 1em;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    form input, form textarea {
      width: 100%;
      padding: 0.8em;
      margin: 0.5em 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }
    form textarea {
      resize: vertical;
    }
    .paypal-button-container {
      margin: 2em auto;
    }
  </style>

  <!-- Add PayPal's script -->
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&components=buttons"></script>
</head>
<body>

  <header>
    <h1>¡Puede Ser Tuyo!</h1>
  </header>

  <img src="CarroNezuko.jpeg" alt="Auto en sorteo" class="car-image">

  <div class="instructions">
    <h2>¿Cómo participar?</h2>
    <p>Para participar, envía el costo del boleto a través de <strong>ATH Móvil</strong> al siguiente número:</p>
    <p><strong>ATH Móvil: </strong></p>
    <p>En el mensaje, incluye tu nombre completo y correo electrónico. Luego, completa el formulario abajo.</p>
  </div>

  <!-- Comprar Boleto Button -->
  <button type="button" class="button" onclick="showPayPalButton();">
    Comprar Boleto
  </button>

  <!-- PayPal Button Section (Hidden initially) -->
  <div id="paypal-button-container" class="paypal-button-container" style="display:none;">
    <h3>Pago del boleto</h3>
    <div id="paypal-button"></div>
  </div>

  <!-- Hidden Form Section -->
  <div id="formulario" class="form-container">
    <h2>Formulario de Participación</h2>
    <form action="https://formspree.io/f/xkgrjnqo" method="POST" id="raffle-form" onsubmit="assignTicketNumber(event)">
      <input type="text" name="nombre" placeholder="Nombre completo" required>
      <input type="tel" name="telefono" placeholder="Número de teléfono" required>
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="text" name="ciudad" placeholder="Ciudad donde resides" required>
      <textarea name="comentario" placeholder="¿Qué harías si ganas el auto?" rows="4" required></textarea>

      <input type="hidden" name="numero_boleto" id="ticket-number">
      <button type="submit" class="button">Enviar</button>
    </form> 
  </div>

  <script>
    function showPayPalButton() {
      // Show PayPal button
      document.getElementById('paypal-button-container').style.display = 'block';
    }

    // PayPal Button Setup
    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: '10.00' // Adjust the amount as needed
            }
          }]
        });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          // Payment approved, show the form and submit
          alert('Pago exitoso, ¡Gracias por participar!');
          document.getElementById('formulario').style.display = 'block';
          // Automatically submit the form after displaying it
          document.getElementById('raffle-form').submit();
        });
      },
      onCancel: function(data) {
        alert('Pago cancelado, por favor intente nuevamente.');
      }
    }).render('#paypal-button'); // Render PayPal button
  </script>

  <script>
    function assignTicketNumber(event) {
      // Prevent form from submitting immediately
      event.preventDefault();

      // Generate a random ticket number
      var num = Math.floor(Math.random() * 7505) + 1;
      document.getElementById('ticket-number').value = num;

      // Submit the form
      event.target.submit();
    }
  </script>

</body>
</html>
